[project]
name = "govuk-rag-assistant"
version = "0.1.0"
description = "Azure-native Q&A assistant that answers UK employee-rights questions from GOV.UK guidance, with citations."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "azure-identity>=1.27.0",
    "azure-search-documents>=12.0.0",
    "azure-storage-blob>=12.31.1",
    "fastapi>=0.162.4",
    "httpx>=0.28.1",
    "openai>=3.49.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
govuk-rag-fetch = "govuk_rag.govuk.fetch:main"
govuk-rag-ingest = "govuk_rag.ingestion.cli:main"
govuk-rag-upload = "govuk_rag.ingestion.upload:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/govuk_rag"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF",
    "ANN", "S", "PT", "PL", "TID", "ERA",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.pyright]
include = ["src", "tests"]
strict = ["src/govuk_rag"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = [
    "error",
    # FastAPI's TestClient still imports httpx; harmless until FastAPI moves off it.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
